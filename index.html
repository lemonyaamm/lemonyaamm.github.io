<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Мой космический мостик</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            
            /* --- ИСПРАВЛЕННЫЙ ФОН --- */
            /* 1. Сначала заливаем красивый градиент (чтобы не было чёрных дыр) */
            background: linear-gradient(135deg, #1e1b4b 0%, #0f202a 100%);
            
            /* 2. Ставим картинку ПОВЕРХ градиента */
            background-image: url('space.jpg'); 
            
            /* 3. ГЛАВНОЕ ИСПРАВЛЕНИЕ: contain вместо cover */
            /* Картинка теперь впишется целиком и не будет сплющена */
            background-size: contain; 
            
            background-position: center;
            background-repeat: no-repeat; /* Чтобы картинка не тиражировалась */
            background-attachment: fixed;
            
            /* Полупрозрачный тёмный слой поверх картинки, чтобы текст читался */
            background-color: rgba(0, 0, 0, 0.6);
            
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5rem;
            z-index: 2;
            position: relative;
        }

        .bridge-container {
            text-align: center;
            z-index: 2;
            position: relative;
        }

        /* --- СТИЛИ КНОПКИ --- */
        .bridge-btn {
            display: inline-block;
            background-color: transparent;
            color: #4fc3f7;
            border: 2px solid #4fc3f7;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 15px rgba(79, 195, 247, 0.2);
            z-index: 2;
        }

        .bridge-btn:hover {
            background-color: #4fc3f7;
            color: #000;
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(79, 195, 247, 0.8);
        }

        .bridge-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 3px;
            background-color: #4fc3f7;
            transition: width 0.4s ease;
        }

        .bridge-btn:hover::after {
            width: 100%;
        }

        .bridge-btn:active {
            transform: translateY(-1px);
        }

        /* --- НОВЫЙ ЦВЕТ ПОДПИСИ --- */
        .subtitle {
            color: #ff4757; /* Ярко-красный цвет */
            margin-top: 15px;
            font-size: 0.9rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            z-index: 2;
        }
    </style>
</head>
<body>

    <h1>Приветули!</h1>

    <div class="bridge-container">
        <a href="https://t.me/lemonyaamm"
 target="_blank" rel="noopener noreferrer" class="bridge-btn">
            Давай построим мостик вместе
        </a>
        <p class="subtitle">Нажми, чтобы перейти в Telegram</p>
    </div>

</body>
</html>
