<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Мой космический мостик</title>

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            
            /* --- ФОН --- */
            background: linear-gradient(135deg, #1e1b4b 0%, #0f202a 100%);
            background-image: url('space.jpg'); 
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: rgba(0, 0, 0, 0.6);
            
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        h1 {
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            text-align: center;
            margin-bottom: 10px;
            font-size: 2.5rem;
            z-index: 3;
            position: relative;
        }
        /* --- СТИКЕР (НОВЫЙ БЛОК) --- */
        .sticker {
            background: rgba(255, 255, 255, 0.15); /* Полупрозрачный белый */
            backdrop-filter: blur(10px); /* Эффект размытия фона под стикером (как матовое стекло) */
            border: 1px solid rgba(255, 255, 255, 0.2); /* Тонкая белая рамка */
            padding: 20px 30px;
            border-radius: 20px; /* Сильное скругление */
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4); /* Тень, чтобы отделить от фона */
            max-width: 500px; /* Чтобы на мобильных не был слишком широким */
            text-align: center;
            margin-bottom: 30px;
            z-index: 3;
            position: relative;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px); /* Для Safari */
        }

        .sticker p {
            margin: 0;
            font-size: 1.1rem;
            line-height: 1.5;
            color: #fff;
            text-shadow: 0 1px 3px rgba(0,0,0,0.5);
        }

        .bridge-container {
            text-align: center;
            z-index: 3;
            position: relative;
        }

        /* --- СТИЛИ КНОПКИ --- */
        .bridge-btn {
            display: inline-block;
            background-color: transparent;
            color: #4fc3f7;
            border: 2px solid #4fc3f7;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 15px rgba(79, 195, 247, 0.2);
        }

        .bridge-btn:hover {
            background-color: #4fc3f7;
            color: #000;
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(79, 195, 247, 0.8);
        }

        .bridge-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 3px;
            background-color: #4fc3f7;
            transition: width 0.4s ease;
        }

        .bridge-btn:hover::after {
            width: 100%;
        }
