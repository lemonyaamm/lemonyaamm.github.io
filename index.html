<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <title>Мой космический мостик</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            min-height: 100vh;
            
            /* --- НАСТРОЙКИ ФОНА --- */
            background-image: url('space.jpg'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            
            /* Полупрозрачная тёмная подложка, чтобы текст читался на любом фоне */
            background-color: rgba(0, 0, 0, 0.7);
            
            color: #f0f0f0;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h1 {
            color: #ffffff;
            text-shadow: 0 2px 10px rgba(0,0,0,0.8);
            text-align: center;
            margin-bottom: 20px;
            font-size: 2.5rem;
        }

        /* Контейнер для кнопки */
        .bridge-container {
            text-align: center;
        }

        /* --- СТИЛИ КНОПКИ-МОСТИКА --- */
        .bridge-btn {
            display: inline-block;
            background-color: transparent;
            color: #4fc3f7; /* Цвет как в Telegram */
            border: 2px solid #4fc3f7;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-decoration: none;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1);
            box-shadow: 0 0 15px rgba(79, 195, 247, 0.2);
        }

        /* Эффект при наведении */
        .bridge-btn:hover {
            background-color: #4fc3f7;
            color: #000;
            transform: translateY(-5px);
            box-shadow: 0 0 30px rgba(79, 195, 247, 0.8);
        }

        /* Анимация линии под текстом */
        .bridge-btn::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0;
            height: 3px;
            background-color: #4fc3f7;
            transition: width 0.4s ease;
        }

        .bridge-btn:hover::after {
            width: 100%;
        }

        /* Эффект при нажатии */
        .bridge-btn:active {
            transform: translateY(-1px);
        }

        .subtitle {
            color: #aaa;
            margin-top: 15px;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <h1>Приветули!</h1>

    <div class="bridge-container">
        <!-- Ссылка, стилизованная под кнопку -->
        <a href="https://t.me/lemonyaamm"
 target="_blank" rel="noopener noreferrer" class="bridge-btn">
            Давай построим мостик вместе
        </a>
        <p class="subtitle">Нажми, чтобы перейти в Telegram</p>
    </div>

</body>
</html>
